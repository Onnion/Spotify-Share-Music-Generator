name: Deploy NestJS to Amazon ECR

env:
  tfstate: "env:/${{ secrets.ECR_REPOSITORY}}/terraform.tfstate"

on:
  push:
    branches:
      - feat/nestjs-depoyment

jobs:
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    env:
      ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com
      ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
      IMAGE_TAG: latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Build Docker image
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -f packages/spotify-nest/deploy/Dockerfile .
      - name: Save Docker image as artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: |
            $(docker save $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG | gzip > image.tar.gz && echo image.tar.gz)

  iac:
    name: Terraform Apply
    runs-on: ubuntu-latest
    needs: build
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
      - name: Terraform Init
        working-directory: packages/spotify-nest/deploy/iac
        run: terraform init \
          -backend-config="bucket=spotify-share-music-generator.tfstate" \
          -backend-config="key=${{ env.tfstate }}" \
          -backend-config="region=${{ secrets.AWS_REGION }}" \
          -backend-config="encrypt=true"
      - name: Terraform Plan
        working-directory: packages/spotify-nest/deploy/iac
        run: terraform plan -out=terraform.tfplan
      - name: Terraform Apply
        working-directory: packages/spotify-nest/deploy/iac
        run: terraform apply -auto-approve terraform.tfplan

  deploy:
    name: Push Docker Image to ECR
    runs-on: ubuntu-latest
    needs: [iac]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Download Docker image artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image
      - name: Load Docker image
        run: |
          gunzip -c image.tar.gz | docker load
      - name: Push Docker image to ECR
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
          IMAGE_TAG: latest
        run: |
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
