[metadata]
name = video
version = 1.0.0
description = Video processing service for Spotify Share Music Generator
author = Your Name
author_email = your_email@example.com
license = MIT
classifiers =
    Programming Language :: Python :: 3
    License :: OSI Approved :: MIT License
    Operating System :: OS Independent

[options]
packages = find:
python_requires = >=3.8
install_requires =
    ffmpeg-python==0.2.0
    pika==1.2.0
    Pillow==8.3.1
    colorthief==0.2.1
    requests==2.15.1
    numpy==1.21.0
    python-dotenv==0.18.0

[flake8]
max-line-length = 88
exclude = .git,__pycache__,venv